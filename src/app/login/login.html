<div class="containerLogin">
    <h1>Login</h1>

    <form #loginForm="ngForm" (ngSubmit)="login()">
        <div class="form-group">
            <label for="user">Email:</label>
            <input type="text" id="user" name="username" [(ngModel)]="datiUtente.username" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" [(ngModel)]="datiUtente.password" required>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Accedi</button>
    </form>

</div>
