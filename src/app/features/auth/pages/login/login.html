<div class="containerLogin">
    <h1>Login</h1>

    <form #loginForm="ngForm" (ngSubmit)="accedi()">
        <div class="form-group">
            <label for="user">Username:</label>
            <input type="text" id="user" name="username" [(ngModel)]="loginRequest.username" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" [(ngModel)]="loginRequest.password" required>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Accedi</button>
    </form>

    <div class="registrati">
        <a routerLink="/forgot-password">Password Dimenticata</a>
        <a routerLink="/register">Registrati</a>
    </div>

</div>
